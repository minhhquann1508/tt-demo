/* =========================================================
   T&T ASSIST — compare the same product across marketplace sellers,
   ranked by weights learned from the shopper's own behaviour (offline mock)
   ========================================================= */
const SELLERS = {
  tt:     {name:'T&T Official',          trust:.98, ret:30, mult:1,    rD:0,   days:[3,5],  share:1,   official:true},
  nordic: {name:'Nordic Living Studio',  trust:.93, ret:30, mult:.95,  rD:-.1, days:[4,6],  share:.42},
  maison: {name:'Maison Craft',          trust:.95, ret:14, mult:1.08, rD:.1,  days:[1,2],  share:.31},
  hanoi:  {name:'Hanoi Ceramic House',   trust:.88, ret:7,  mult:.88,  rD:-.2, days:[5,8],  share:.55},
  budget: {name:'Budget Home Deals',     trust:.74, ret:0,  mult:.79,  rD:-.5, days:[6,10], share:1.6},
};
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
function offersFor(p){
  const others = ['nordic','maison','hanoi','budget'], h = hash(p.id);
  const pick = others.filter((_, i) => (h >> i) % 4 !== 0).slice(0, 3);
  while (pick.length < 3) pick.push(others.find(x => !pick.includes(x)));
  return ['tt', ...pick].map((id, i) => {
    const s = SELLERS[id], jit = id === 'tt' ? 0 : (((h >> (i * 3)) % 7) - 3) / 100;
    const price = id === 'tt' ? p.price : Math.round(p.price * (s.mult + jit) * 2) / 2 - .01;
    const rating = Math.min(5, Math.max(3.6, +(p.rating + s.rD + (id === 'tt' ? 0 : ((h >> i) % 3 - 1) / 10)).toFixed(1)));
    return {id, ...s, price: Math.max(1, +price.toFixed(2)), rating, reviews: Math.max(6, Math.round(p.count * s.share)), d: (s.days[0] + s.days[1]) / 2};
  });
}

const BALANCED = {price:.35, rating:.30, speed:.20, trust:.15};
function profile(){
  seedDemoOrders();
  const s = sig(), n = k => s[k] || 0;
  const orders = myOrders().filter(o => o.status !== 'cancelled'), exp = orders.filter(o => o.ship === 'express').length;
  const sigs = {
    price:  Math.min(5, n('sortLow') + n('priceFilter') + n('promo') + n('cheapPick')),
    rating: Math.min(5, n('rv5') + n('sortRating') + n('ratingFilter') + n('topPick')),
    speed:  Math.min(5, exp * 1.5 + n('buyNow') * .5 + n('fastPick')),
    trust:  Math.min(5, n('officialPick')),
  };
  const events = ['sortLow','priceFilter','promo','cheapPick','rv5','sortRating','ratingFilter','topPick','buyNow','fastPick','officialPick'].reduce((a, k) => a + n(k), 0) + orders.length;
  const learned = events > 0;
  const raw = {price:1 + .5 * sigs.price, rating:1 + .5 * sigs.rating, speed:1 + .5 * sigs.speed, trust:.7 + .3 * sigs.trust};
  const sum = Object.values(raw).reduce((a, b) => a + b, 0);
  const w = (!learned || !state.asst.personal) ? {...BALANCED} : Object.fromEntries(Object.entries(raw).map(([k, v]) => [k, v / sum]));
  // human-readable evidence for each learned preference
  const traits = [];
  if (exp) traits.push({k:'speed', icon:'zap', txt: fill(t('as.tExpress'), {n:exp, total:orders.length})});
  if (n('rv5') + n('sortRating') + n('ratingFilter')) traits.push({k:'rating', icon:'star', txt: fill(t('as.tRating'), {n:n('rv5') + n('sortRating') + n('ratingFilter')})});
  if (n('promo') + n('sortLow') + n('priceFilter')) traits.push({k:'price', icon:'card', txt: fill(t('as.tPrice'), {n:n('promo') + n('sortLow') + n('priceFilter')})});
  if (n('officialPick')) traits.push({k:'trust', icon:'lock', txt: t('as.tTrust')});
  return {w, sigs, traits, events, orders: orders.length, learned};
}

/* ---------- scoring ---------- */
function rankOffers(offers, w){
  const rng = (arr) => { const mn = Math.min(...arr), mx = Math.max(...arr); return v => mx === mn ? 1 : (v - mn) / (mx - mn); };
  const bayes = o => (o.rating * o.reviews + 4.2 * 30) / (o.reviews + 30);
  const pN = rng(offers.map(o => -o.price)), rN = rng(offers.map(bayes)), sN = rng(offers.map(o => -o.d)),
        tN = rng(offers.map(o => o.trust * .7 + Math.min(o.ret, 30) / 30 * .3));
  const ranked = offers.map(o => {
    const parts = {price:pN(-o.price), rating:rN(bayes(o)), speed:sN(-o.d), trust:tN(o.trust * .7 + Math.min(o.ret, 30) / 30 * .3)};
    const s = Object.keys(parts).reduce((a, k) => a + parts[k] * w[k], 0);
    return {...o, parts, raw:s, score: Math.round(52 + s * 46)};
  }).sort((a, b) => b.raw - a.raw);
  const by = (f) => ranked.reduce((best, o) => f(o) > f(best) ? o : best, ranked[0]).id;
  const tags = {best: ranked[0].id, cheap: by(o => -o.price), fast: by(o => -o.d), top: by(bayes)};
  return {ranked, tags};
}

/* ---------- intents ---------- */
function compareProduct(pid, fromPdp){
  const p = P(pid); state.asst.ctx = pid; pushRecent(pid);
  if (!fromPdp) {} // user message already pushed by caller
  state.asst.msgs.push({from:'bot', type:'text', k:'as.searching', p:{pname:p.name}});
  paintAsst(true);
  const pr = profile(), {ranked, tags} = rankOffers(offersFor(p), pr.w), b = ranked[0];
  const strengths = CRIT.slice().sort((x, y) => b.parts[y] * pr.w[y] - b.parts[x] * pr.w[x]).slice(0, 2).map(k =>
    k === 'price' ? fill(t('as.sPrice'), {price:money(b.price)}) : k === 'rating' ? fill(t('as.sRating'), {r:b.rating}) : k === 'speed' ? fill(t('as.sSpeed'), {d:daysTxt(b)}) : t('as.sTrust'));
  asstSay([
    {from:'bot', type:'text', k:'as.found', p:{n:ranked.length, seller:b.name, why: strengths.join(t('as.and'))}},
    {from:'bot', type:'compare', pid},
  ], 1100);
}
function answerAbout(kind){
  const p = P(state.asst.ctx), {ranked, tags} = rankOffers(offersFor(p), profile().w), f = id => ranked.find(o => o.id === id);
  if (kind === 'cheap'){ const o = f(tags.cheap); asstSay([{from:'bot', type:'text', k: o.ret ? 'as.aCheap' : 'as.aCheapWarn', p:{seller:o.name, price:o.price, d:daysTxt(o)}}]); }
  if (kind === 'fast'){ const o = f(tags.fast); asstSay([{from:'bot', type:'text', k:'as.aFast', p:{seller:o.name, price:o.price, d:daysTxt(o)}}]); }
  if (kind === 'top'){ const o = f(tags.top); asstSay([{from:'bot', type:'text', k:'as.aTop', p:{seller:o.name, r:o.rating, n:o.reviews}}]); }
  if (kind === 'alts'){
    const ids = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).sort((a, b) => b.rating - a.rating).slice(0, 3).map(x => x.id);
    asstSay([{from:'bot', type:'text', k:'as.alts'}, {from:'bot', type:'alts', ids}]);
  }
}
function handleQuery(q){
  const qn = norm(q);
  state.asst.msgs.push({from:'me', text:q}); paintAsst(true);
  const ctx = state.asst.ctx;
  if (ctx && /(re nhat|cheap|gia thap|lowest)/.test(qn)) return answerAbout('cheap');
  if (ctx && /(nhanh|fast|quick|som)/.test(qn)) return answerAbout('fast');
  if (ctx && /(danh gia|rated|review|tot nhat)/.test(qn)) return answerAbout('top');
  if (ctx && /(tuong tu|similar|thay the|alternative)/.test(qn)) return answerAbout('alts');
  const lim = /(duoi|under|<)\s*\$?\s*([\d.,]+)\s*(k|tr|trieu)?/.exec(qn);
  if (lim){
    let v = +lim[2].replace(/[.,](?=\d{3}\b)/g, '').replace(',', '.');
    if (lim[3] === 'k') v *= 1000; if (lim[3] && lim[3] !== 'k') v *= 1e6;
    const usd = v > 2000 ? v / VND_RATE : v;
    const ids = PRODUCTS.filter(p => p.price <= usd).sort((a, b) => b.rating - a.rating).slice(0, 4).map(p => p.id);
    return asstSay(ids.length ? [{from:'bot', type:'text', k:'as.under', p:{price:usd}}, {from:'bot', type:'pick', ids}] : [{from:'bot', type:'text', k:'as.none', p:{q}}]);
  }
  const words = qn.split(/\s+/).filter(w => w.length > 1 && !['tim','find','so','sanh','compare','gia','price','cho','toi','me','the','a'].includes(w));
  const scored = PRODUCTS.map(p => {
    const hay = norm(`${I18N.vi[p.name]} ${I18N.en[p.name]} ${p.kw} ${I18N.vi[CAT_KEY[p.cat]]} ${I18N.en[CAT_KEY[p.cat]]}`);
    return {id:p.id, s: words.filter(w => hay.includes(w)).length + (words.length && norm(I18N.vi[p.name] + ' ' + I18N.en[p.name]).includes(words.join(' ')) ? 2 : 0)};
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  if (!scored.length) return asstSay([{from:'bot', type:'text', k:'as.none', p:{q}}]);
  const top = scored.filter(x => x.s === scored[0].s);
  if (top.length === 1) return setTimeout(() => compareProduct(top[0].id), 300);
  asstSay([{from:'bot', type:'text', k:'as.pick', p:{q}}, {from:'bot', type:'pick', ids: top.slice(0, 4).map(x => x.id)}]);
}

/* =========================================================
   GEMINI — tuỳ chọn gọi AI thật (Google Gemini API)
   Ưu tiên: key người dùng nhập (chỉ lưu localStorage của trình duyệt này, gửi thẳng tới Google)
   → proxy /api/gemini trên Vercel (key nằm trong biến môi trường GEMINI_API_KEY)
   → không có cả hai thì các tính năng AI quay về bản mô phỏng.
   Cấu hình dùng chung key 'tt_gem' nên app mua hàng và Seller Center nhập một lần là đủ.
   ========================================================= */
const GEM_TEXT_MODELS = ['gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-3.6-flash'];
const GEM_IMAGE_MODELS = ['gemini-3.1-flash-lite-image', 'gemini-3.1-flash-image', 'gemini-nano-banana-2.1', 'gemini-3-pro-image'];
/* OpenRouter: văn bản / đọc ảnh CHỈ dùng model miễn phí (":free" và router "openrouter/free"); model hay bị nghẽn
   nên mỗi lần gọi kèm danh sách dự phòng toàn model miễn phí. Chỉ tạo ảnh là tính phí. */
const OR_TEXT_MODELS = ['google/gemma-4-31b-it:free', 'google/gemma-4-26b-a4b-it:free', 'openrouter/free'];
const orFree = m => /:free$/.test(m) || m === 'openrouter/free';
const OR_IMAGE_MODELS = ['google/gemini-3.1-flash-lite-image', 'google/gemini-3.1-flash-image', 'google/gemini-2.5-flash-image', 'openai/gpt-5-image-mini'];
/* JSON từ model đôi khi bọc trong ```json … ``` hoặc kèm lời dẫn → lấy đoạn từ { đầu tiên tới } cuối cùng */
function parseJSONLoose(text){
  const s = text.replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  try { return JSON.parse(s); } catch(e){ const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a >= 0 && b > a) return JSON.parse(s.slice(a, b + 1)); throw e; }
}
const GEM = {
  proxy: false, orProxy: false,
  /* mặc định: model văn bản nhẹ, BẬT tạo ảnh bằng model rẻ nhất (có tính phí, chỉ trừ tiền khi người dùng bấm nút tạo ảnh).
     Cài đặt lưu từ bản cũ được chuyển sang mặc định mới, giữ lại key, nhà cung cấp và model văn bản. */
  cfg(){
    const saved = store.get('tt_gem', {}) || {};
    const base = {provider:'gemini', key:'', orKey:'', on:true, text:GEM_TEXT_MODELS[0], image:'gemini-3.1-flash-lite-image', orText:OR_TEXT_MODELS[0], orImage:OR_IMAGE_MODELS[0], v:3};
    if (saved.v >= 3) return Object.assign(base, saved);
    const keep = saved.v ? {provider:saved.provider || 'gemini', text:saved.text || base.text, orKey:saved.orKey || '', orText:saved.orText || base.orText} : {};
    return Object.assign(base, keep, {key:saved.key || '', on:saved.on !== false});
  },
  isOR(c = GEM.cfg()){ return c.provider === 'openrouter'; },
  name(){ return GEM.isOR() ? 'OpenRouter' : 'Gemini'; },
  server(){ const c = GEM.cfg(); return GEM.isOR(c) ? !c.orKey && GEM.orProxy : !c.key && GEM.proxy; },
  imageOn(){ const c = GEM.cfg(); return GEM.live() && (GEM.isOR(c) ? c.orImage : c.image) !== 'off'; },
  save(c){ store.set('tt_gem', Object.assign(c, {v:3})); window.__aiBrand = GEM.name(); },
  live(){ const c = GEM.cfg(); return c.on && (GEM.isOR(c) ? !!c.orKey || GEM.orProxy : !!c.key || GEM.proxy); },
  async probe(){
    if (!/^https?:$/.test(location.protocol)) return;
    await Promise.all([['/api/gemini', 'proxy'], ['/api/openrouter', 'orProxy']].map(async ([u, k]) => {
      try { const r = await fetch(u); if (r.ok){ const j = await r.json(); GEM[k] = !!j.hasKey; } } catch(e){}
    }));
  },
  /* kind: 'text' (văn bản + đọc ảnh) | 'image' (tạo / sửa ảnh). Trả về object JSON, chuỗi, hoặc {image:dataURL, text}. */
  async gen(kind, parts, opts = {}){
    if (GEM.isOR()) return GEM.genOR(kind, parts, opts);
    const {json = false, temp} = opts;
    const c = GEM.cfg(), model = kind === 'image' ? c.image : c.text;
    if (kind === 'image' && model === 'off') throw Object.assign(new Error('image generation off'), {code:'image-off'});
    const body = {contents:[{role:'user', parts}], generationConfig:{}};
    if (json) body.generationConfig.responseMimeType = 'application/json';
    if (kind === 'image') body.generationConfig.responseModalities = ['TEXT', 'IMAGE'];
    if (temp != null) body.generationConfig.temperature = temp;
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), kind === 'image' ? 120000 : 45000);
    try {
      const r = c.key
        ? await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
            {method:'POST', signal:ctl.signal, headers:{'content-type':'application/json', 'x-goog-api-key':c.key}, body:JSON.stringify(body)})
        : await fetch('/api/gemini', {method:'POST', signal:ctl.signal, headers:{'content-type':'application/json'}, body:JSON.stringify({model, body})});
      const j = await r.json().catch(() => ({}));
      if (!r.ok){
        const msg = (j.error && j.error.message) || 'HTTP ' + r.status;
        throw Object.assign(new Error(msg), {code: r.status === 429 || /quota|RESOURCE_EXHAUSTED/i.test(msg) ? 'quota' : r.status});
      }
      const out = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
      const text = out.filter(p => p.text && !p.thought).map(p => p.text).join('\n').trim();
      const pic = out.map(p => p.inlineData || p.inline_data).find(Boolean);
      if (kind === 'image'){
        if (!pic) throw new Error(text || (j.promptFeedback && j.promptFeedback.blockReason) || 'no image returned');
        return {image:`data:${pic.mimeType || pic.mime_type || 'image/png'};base64,${pic.data}`, text};
      }
      if (!text) throw new Error((j.promptFeedback && j.promptFeedback.blockReason) || 'empty response');
      return json ? parseJSONLoose(text) : text;
    } catch(e){ throw e.name === 'AbortError' ? new Error('timeout') : e; }
    finally { clearTimeout(timer); }
  },
  /* OpenRouter (API kiểu OpenAI): part văn bản/ảnh → content, ảnh trả về nằm trong message.images */
  async genOR(kind, parts, {json = false, temp} = {}){
    const c = GEM.cfg(), model = kind === 'image' ? c.orImage : c.orText;
    if (kind === 'image' && model === 'off') throw Object.assign(new Error('image generation off'), {code:'image-off'});
    const content = parts.map(p => p.text != null ? {type:'text', text:p.text}
      : {type:'image_url', image_url:{url:`data:${p.inlineData.mimeType};base64,${p.inlineData.data}`}});
    const body = {messages:[{role:'user', content}]};
    if (kind === 'image') Object.assign(body, {model, modalities:['image', 'text']});
    else body.models = [...new Set([model, ...OR_TEXT_MODELS])].filter(orFree).slice(0, 3);
    if (temp != null) body.temperature = temp;
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), kind === 'image' ? 120000 : 60000);
    try {
      const headers = {'content-type':'application/json', 'X-Title':'T&T demo'};
      if (/^https?:$/.test(location.protocol)) headers['HTTP-Referer'] = location.origin;
      const r = c.orKey
        ? await fetch('https://openrouter.ai/api/v1/chat/completions', {method:'POST', signal:ctl.signal, headers:Object.assign(headers, {Authorization:'Bearer ' + c.orKey}), body:JSON.stringify(body)})
        : await fetch('/api/openrouter', {method:'POST', signal:ctl.signal, headers:{'content-type':'application/json'}, body:JSON.stringify({body})});
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error){
        const e = j.error || {}, raw = e.metadata && e.metadata.raw ? ` (${String(e.metadata.raw).slice(0, 120)})` : '';
        const code = r.status === 402 || e.code === 402 ? 'credit' : r.status === 429 || e.code === 429 ? 'quota' : r.status;
        throw Object.assign(new Error((e.message || 'HTTP ' + r.status) + raw), {code});
      }
      const msg = (j.choices && j.choices[0] && j.choices[0].message) || {};
      const text = (typeof msg.content === 'string' ? msg.content : (msg.content || []).map(x => x.text || '').join('')).trim();
      if (kind === 'image'){
        const url = msg.images && msg.images[0] && msg.images[0].image_url && msg.images[0].image_url.url;
        if (!url) throw new Error(text || 'no image returned');
        return {image:url, text};
      }
      if (!text) throw new Error('empty response');
      return json ? parseJSONLoose(text) : text;
    } catch(e){ throw e.name === 'AbortError' ? new Error('timeout') : e; }
    finally { clearTimeout(timer); }
  },
  /* ảnh (URL Unsplash, blob: hoặc data:) → part inlineData, thu nhỏ còn tối đa `max` px để gửi nhẹ */
  async img(src, max = 1024){
    const blob = await (await fetch(src)).blob();
    const bmp = await createImageBitmap(blob), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return {inlineData:{mimeType:'image/jpeg', data:cv.toDataURL('image/jpeg', .86).split(',')[1]}};
  },
  langLine(){ return state.lang === 'vi' ? 'Write all user-facing text in Vietnamese.' : 'Write all user-facing text in English.'; },
};

  : notify({type:'error', title:t('gem.errT'), msg:`${String(e.message || e).slice(0, 160)} · ${t('gem.fallback')}`, ms:6000});

/* Thử tại nhà: ghép ảnh thật bằng model tạo ảnh + nhận xét bằng model văn bản */
async function tryonGem(){
  const T = state.tryon, p = P(T.pid), v = p.variants[T.vi], room = tryonRoom();
  if (!GEM.live()) return openGem(t('gem.needKey'));
  if (T.gemBusy) return;
  T.gemBusy = true; render();
  try {
    const roomSrc = T.mode === 'mine' && T.upload ? T.upload : unsplash(room.img, 1024, 1180);
    const [roomPart, prodPart] = await Promise.all([GEM.img(roomSrc), GEM.img(unsplash(v.img, 800))]);
    const name = I18N.en[p.name], color = I18N.en[v.k];
    const pic = !GEM.imageOn() ? Promise.resolve(null) : GEM.gen('image', [
      {text:`Edit the FIRST image, a photo of a room. Place the product from the SECOND image into the room so that its base rests about ${Math.round(T.x)}% from the left and ${Math.round(T.y)}% from the top, on the nearest table, shelf or floor surface. Product: ${name}, colour ${color}, real size ${p.dim}; keep it at true scale relative to the furniture. Keep the product's exact shape, colour, glaze and pattern: do not redesign or beautify it. Match the room's lighting and perspective and add a natural contact shadow. Leave the rest of the room unchanged. Return only the edited photo.`},
      roomPart, prodPart]);
    const notes = GEM.gen('text', [
      {text:`You are an interior stylist for a home-goods shop. The FIRST image is the customer's room, the SECOND is the product "${name}" (${color}, ${p.dim}). Return JSON {"notes":[three short sentences]}: 1) whether the colour suits the room, 2) whether the size fits and where to put it, 3) one styling tip. ${GEM.langLine()}`},
      roomPart, prodPart], {json:true}).catch(e => { if (!GEM.imageOn()) throw e; return null; });
    const [r, n] = await Promise.all([pic, notes]);
    if (state.tryon !== T) return;
    if (!r && !(n && Array.isArray(n.notes))) throw new Error('empty response');
    Object.assign(T, {gemImg:r ? r.image : T.gemImg, gemShow:!!r || T.gemShow, gemNotes:n && Array.isArray(n.notes) ? n.notes.slice(0, 3) : T.gemNotes});
    markDone(T.mode === 'mine' ? 24 : 23);
  } catch(e){ gemFail(e); }
  finally { T.gemBusy = false; if (state.tryon === T && $('#toStage, .to-stage')) render(); }
}

/* Tìm bằng ảnh: model văn bản đọc ảnh và so với danh mục */
async function vsearchGem(key, q){
  state.vsGem = state.vsGem || {};
  const catalog = PRODUCTS.map(p => ({id:p.id, name:I18N.en[p.name], category:I18N.en[CAT_KEY[p.cat]], colours:p.variants.map(v => I18N.en[v.k]), keywords:p.kw}));
  try {
    const part = await GEM.img(q.img, 768);
    const r = await GEM.gen('text', [{text:`A shopper uploaded the attached photo to find a similar product. Identify the main object, then rank the catalog by visual similarity (type, shape, material, colour). Catalog: ${JSON.stringify(catalog)}
Return JSON {"label": short name of the object, "attributes": [3 short attributes], "matches": [{"id": catalog id, "score": 0-100}] (best 6, highest first)}. ${GEM.langLine()}`}, part], {json:true});
    const ids = new Set(PRODUCTS.map(p => p.id));
    r.matches = (r.matches || []).filter(m => ids.has(m.id)).map(m => ({id:m.id, score:Math.max(0, Math.min(100, Math.round(+m.score || 0)))}));
    if (!r.matches.length) throw new Error('no catalog match');
    state.vsGem[key] = r;
  } catch(e){ gemFail(e); state.vsGem[key] = {failed:true}; }
}

/* Tóm tắt review: gửi nội dung đánh giá để model tóm tắt khen / chê */
async function reviewGem(p){
  state.rvGem = state.rvGem || {};
  const k = p.id + ':' + state.lang;
  if (state.rvGem[k] === 'busy') return;
  if (!GEM.live()) return openGem(t('gem.needKey'));
  state.rvGem[k] = 'busy'; render();
  const reviews = reviewsFor(p).map(r => ({stars:r.s, title:r.title || I18N.en[r.k + 't'] || '', text:r.body || I18N.en[r.k] || ''}));
  try {
    const r = await GEM.gen('text', [{text:`Summarise these verified reviews of "${I18N.en[p.name]}" (${p.count} reviews in total, average ${p.rating}★; below is a sample). Reviews: ${JSON.stringify(reviews)}
Return JSON {"lead": one-sentence overview, "pros": [{"t": short point, "pct": estimated % of reviews mentioning it}] (3 items), "cons": [{"t":..., "pct":...}] (1-2 items), "tip": one practical buying tip}. ${GEM.langLine()}`}], {json:true});
    state.rvGem[k] = r;
  } catch(e){ delete state.rvGem[k]; gemFail(e); }
  render();
}

   ========================================================= */
const AUTO = {running:false, paused:false, speed:1};
const AUTO_SPEEDS = {slow:1.45, normal:1, fast:.6};
class AutoStop extends Error {}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function aw(ms){
  let left = ms * AUTO.speed;
  while (left > 0){ if (!AUTO.running) throw new AutoStop(); if (!AUTO.paused) left -= 50; await sleep(50); }
}
async function waitFor(sel, timeout = 8000){
  const t0 = Date.now();
  while (Date.now() - t0 < timeout){
    if (!AUTO.running) throw new AutoStop();
    const el = document.querySelector(sel); if (el && !el.disabled) return el;
    await sleep(80);
  }
  throw new Error('waitFor ' + sel);
}
function reveal(el){
  const sc = el.closest('#screen, .asst-body, .sheet-b'); if (!sc) return;
  const r = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
  if (r.top < sr.top + 70 || r.bottom > sr.bottom - 100)
    sc.scrollTo({top: sc.scrollTop + r.top - sr.top - sr.height / 2 + r.height / 2, behavior:'smooth'});
}
function ripple(el){
  const app = $('#app').getBoundingClientRect(), r = el.getBoundingClientRect(), d = document.createElement('span');
  d.className = 'auto-tap'; d.style.left = (r.left - app.left + r.width / 2) + 'px'; d.style.top = (r.top - app.top + r.height / 2) + 'px';
  $('#app').appendChild(d); setTimeout(() => d.remove(), 800);
}
async function tap(sel, after = 650){
  const el = typeof sel === 'string' ? await waitFor(sel) : sel;
  reveal(el); await aw(420); ripple(el); await aw(240); el.click(); await aw(after);
}

  const el = await waitFor(sel); reveal(el); await aw(300); ripple(el);
  el.focus({preventScroll:true}); el.value = '';

/* =========================================================
   ROUTER & RENDER
   ========================================================= */
const ROUTES = {
  welcome: screenWelcome, signup: screenSignup, otp: screenOtp, signin: screenSignin, forgot: screenForgot,
  home: screenHome, search: screenSearch, product: screenProduct, reviews: screenReviews,
  cart: screenCart, order: screenOrder, checkout: screenCheckout, pay: screenPay, success: screenSuccess, orders: screenOrders, account: screenAccount, favorites: screenFavorites, addresses: screenAddresses, payments: screenPayments,
  tryon: screenTryon, vsearch: screenVsearch,
  components: screenComponents,
};
const TAB_ROUTES = ['home','search','cart','orders','account'];
const GUEST_ONLY = ['welcome','signup','otp','signin','forgot'];
let pendingRedirect = null;
function redirect(r){ pendingRedirect = r; return ''; }
/* In-memory nav stack is the source of truth; the URL hash is mirrored when the
   environment allows it (some previews run from data: URLs where it can't change). */
const hashRoute = () => location.hash.replace(/^#\/?/, '');
const nav = { stack: [hashRoute() || ''] };
function syncHash(replace){
  try { history[replace ? 'replaceState' : 'pushState'](null, '', '#/' + nav.stack[nav.stack.length - 1]); } catch(e){}
}
function parseRoute(){
  const [path, qs = ''] = (nav.stack[nav.stack.length - 1] || '').split('?');
  const [name, ...rest] = path.split('/');
  if (!ROUTES[name]) return {name: state.user ? 'home' : 'welcome', param:''};
  if (state.user && GUEST_ONLY.includes(name)) return {name:'home', param:''};
  if (!state.user && !GUEST_ONLY.includes(name) && name !== 'components') return {name:'welcome', param:''};
  return {name, param: rest.join('/') || qs};
}
function go(route, {replace=false}={}){
  if (replace) nav.stack[nav.stack.length - 1] = route; else nav.stack.push(route);
  syncHash(replace); render(true);
}
function goBack(fallback){
  if (nav.stack.length > 1){ nav.stack.pop(); syncHash(true); render(true); }
  else go(fallback, {replace:true});
}
let lastRoute = null;
function render(scrollTop=false){
  document.documentElement.lang = state.lang;
  const r = parseRoute();
  if (r.name !== 'forgot') state.resetSentTo = '';
  if (r.name !== 'pay') state.payErr = '';
  $('#app').dataset.screen = r.name;
  $('#screen').innerHTML = ROUTES[r.name](r.param);
  if (pendingRedirect){ const to = pendingRedirect; pendingRedirect = null; return go(to, {replace:true}); }
  if (scrollTop || r.name !== lastRoute) $('#screen').scrollTop = 0;
  if (r.name === 'otp') startOtpCountdown();
  paintTabbar(r.name);
  paintAsstFab(r.name);
  if (r.name === 'product') bindGallery();
  if (r.name === 'tryon') bindTryon();
  if (r.name === 'vsearch') bindVsearch();
  $$('[data-swipe]').forEach(bindSwipe);
  lastRoute = r.name;
  renderDemo();
}
function paintTabbar(name){
  const tb = $('#tabbar');
  if (!TAB_ROUTES.includes(name)){ tb.hidden = true; return; }
  tb.hidden = false; tb.innerHTML = $('nav', new DOMParser().parseFromString(tabbarHTML(name), 'text/html')).innerHTML;
}
function bindGallery(){
  const g = $('#gal'); if (!g) return;
  g.scrollLeft = state.pdp.vi * g.clientWidth;
  let tm; g.addEventListener('scroll', () => { clearTimeout(tm); tm = setTimeout(() => {
    const i = Math.round(g.scrollLeft / g.clientWidth);
    if (i !== state.pdp.vi){ state.pdp.vi = i; syncPdp(); markDone(5); }
  }, 90); }, {passive:true});
}

  const fab = $('#asstFab'), tip = $('#asstTip'), show = ASST_ROUTES.includes(name) && !!state.user;

window.addEventListener('popstate', () => {
  const h = hashRoute();
  if (nav.stack.length > 1 && nav.stack[nav.stack.length - 2] === h) nav.stack.pop(); else nav.stack[nav.stack.length - 1] = h;
  render(true);
});

/* Password meter + OTP auto-advance */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.pwmeter){
    const v = el.value; let lv = 0;
    if (v.length >= 1) lv = 1;
    if (v.length >= 8) lv = 2;
    if (v.length >= 8 && /\d/.test(v) && /[a-z]/i.test(v)) lv = 3;
    if (lv === 3 && v.length >= 12 && /[^a-z0-9]/i.test(v)) lv = 4;
    document.getElementById(el.dataset.pwmeter).dataset.lv = lv;
    const lab = document.getElementById(el.dataset.pwmeter + '-label'); if (lab) lab.textContent = lv ? t('pw.' + lv) : '';
  }
  const otpBox = el.closest('[data-otp]');
  if (otpBox){
    const digits = el.value.replace(/\D/g,'');
    if (digits.length > 1){ // autofill / paste of whole code
      const ins = $$('input', otpBox); const start = ins.indexOf(el);
      digits.split('').slice(0, 6 - start).forEach((d, k) => ins[start + k].value = d);
      ins[Math.min(5, start + digits.length - 1)].focus();
    } else {
      el.value = digits;
      if (el.value && el.nextElementSibling) el.nextElementSibling.focus();
    }
    otpBox.classList.remove('err');
  }
  const f = el.closest('[data-field].has-error'); if (f) setErr(f.dataset.field, '');
  if (el.id === 'si-email') showSuggest(el);
  if (el.id === 'q'){ state.search.q = el.value; updateResults(); }
  if (/^cc-(num|exp|cvc)$/.test(el.id)) formatCardInput(el);
  if (el.hasAttribute && el.hasAttribute('data-co-note')) state.co.note = el.value;
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (el.closest && el.closest('[data-otp]') && e.key === 'Backspace' && !el.value && el.previousElementSibling) el.previousElementSibling.focus();
  if (e.key === 'Escape'){ if ($('#overlays .overlay')) closeOverlay(); else if (state.asst.open) closeAsst(); }
  if (el.id === 'q' && e.key === 'Enter'){ saveRecent(el.value); el.blur(); }
});

document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.has-suggest')) setTimeout(() => { if (!document.activeElement?.closest?.('.suggest')) hideSuggest(); }, 120); });
document.addEventListener('mousedown', e => { if (e.target.closest('.suggest')) e.preventDefault(); });

  rvSort(el){ state.rv.sort = el.value; render(); },
};
document.addEventListener('change', e => { const a = e.target.dataset && e.target.dataset.actionChange; if (a && changeActions[a]) changeActions[a](e.target); });
document.addEventListener('change', e => { const f = e.target.closest('[data-field].has-error'); if (f) setErr(f.dataset.field, ''); });

/* Ảnh người dùng chọn (thử tại nhà / tìm bằng ảnh) chỉ đọc qua object URL trên máy, không tải đi đâu */
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fitFile'){
    const f = el.files && el.files[0]; if (!f || !/^image\//.test(f.type)) return;
    Object.assign(state.fit, {mode:'mine', upload:URL.createObjectURL(f), phase:'scan', gemImg:null, gemNotes:null});
    return render();
  }
  if (!['toFile','vsFile'].includes(el.id)) return;
  const f = el.files && el.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)){ notify({type:'error', title:t('vs.err'), msg:t('vs.errS')}); return; }
  const url = URL.createObjectURL(f);
  if (el.id === 'toFile'){ const T = state.tryon; T.mode = 'mine'; T.upload = url; T.sample = false; T.spot = 0; placeAtSpot(); rescanTryon(); return; }
  const name = norm(f.name), pool = PRODUCTS.filter(p => !p.variants.every(v => v.oos));
  const hit = pool.find(p => p.kw.split(' ').some(w => w.length > 2 && name.includes(w))) || pool[(f.size + f.name.length) % pool.length];
  state.vsUpload = {pid:hit.id, img:url, src:''}; closeOverlay(); go('vsearch/upload');
});
document.addEventListener('input', e => {
  const F = state.fit;
  if (F && (e.target.id === 'fitH' || e.target.id === 'fitW')){
    F[e.target.id === 'fitH' ? 'h' : 'w'] = +e.target.value || F[e.target.id === 'fitH' ? 'h' : 'w']; F.size = '';
    const box = $('#fitSug'); if (box) box.innerHTML = fitSugHTML(F);
    return;
  }
  if (e.target.id !== 'toScale') return;
  const T = state.tryon, it = $('#toItem'); T.scale = +e.target.value / 100;
  if (it){ const w = itemWidth(P(T.pid), tryonRoom(), T.scale); it.style.width = w + '%'; it.style.margin = `-${w}% 0 0 -${w / 2}%`; }
});

render();
GEM.probe().then(() => { if (GEM.proxy || GEM.orProxy) render(); });
</script>
</body>
</html>
