  oTab(el){ markDone('oTab'); state.o.tab = el.dataset.v; state.o.sel.clear(); state.o.page = 1; refreshO(true); },
  oSort(el){ const k = el.dataset.k; state.o.sort = {k, dir: state.o.sort.k === k ? -state.o.sort.dir : 1}; refreshO(); },
  oPage(el){ state.o.page = +el.dataset.v; refreshO(); $('#oTable')?.scrollIntoView({block:'start'}); },
  oClear(){ Object.assign(state.o, {tab:'all', q:'', pay:'all', car:'all', page:1}); refreshO(true); },
  oSelClear(){ state.o.sel.clear(); refreshO(); },
  oMenu(el){ if (popEl && popEl._anchor === el) return closePop(); openPop(el, oMenuHTML(el.dataset.id)); },
  oDo(el){ closePop(); oDo(el.dataset.v, el.dataset.id); },
  oBulk(el){
    const sel = [...state.o.sel].map(findOrder).filter(Boolean), v = el.dataset.v;
    if (v === 'confirm') confirmOrders(sel.filter(o => o.st === 'new'));
    if (v === 'print') printLabels(sel.filter(o => o.st === 'packing' && !o.label));
    if (v === 'handover') handoverOrders(sel.filter(o => o.st === 'packing' && o.label));
  },
  oSaveNote(el){ const o = findOrder(el.dataset.id); o.note = $('#oNote').value; saveOrders(); markDone('oNote'); notify({title:t('n.noteSaved')}); },
  fillReason(el){ const ta = $('#dlgReason'); ta.value = el.dataset.v; ta.closest('.field').classList.remove('has-error'); ta.closest('.field').querySelector('.err-msg')?.remove(); },
  dxOk(){ const root = $('#overlays').lastElementChild; const cb = dlgCb && dlgCb.ok; if (cb && cb(root) === false) return; closeOverlay(); },
  dxAlt(){ const root = $('#overlays').lastElementChild; const cb = dlgCb && dlgCb.alt; closeOverlay(); cb && cb(root); },
  gResetData(silent){ VOUCHERS = JSON.parse(JSON.stringify(VOUCHERS_SEED)); FIN = {avail:745.6, pending:248.4, out:960, tx:[]}; state.set.ret = state.set.retSaved = 7; REVIEWS = JSON.parse(JSON.stringify(REVIEWS_SEED)); store.set('tts_reviews', null); CONVS = JSON.parse(JSON.stringify(CONVS_SEED)); state.msg.open = null; state.rv.open = null; ORDERS = seedOrders(); store.set('tts_orders', null); store.set('tts_products', null); PRODUCTS = loadProducts(); state.pd = null; state.pr.sel.clear(); state.o.sel.clear(); if (state.authed){ refreshChrome(); renderPage(); } if (silent !== true) notify({type:'info', title:t('n.dataReset')}); },
  guide(){ openGuide(); },
  gTab(el){ state.gTab = el.dataset.v; $('#guideBody').innerHTML = guideBodyHTML(); },
  gTry(el){ guideTry(el.dataset.k); },
  gOpen(el){ closeOverlay(); if (el.dataset.r === 'login') return doLogout(true); if (!state.authed){ state.authed = true; store.set('tts_auth', true); } go(el.dataset.r); },
  gReset(){ CHECKS.forEach(c => done.delete(c.k)); store.set('tts_done', []); $('#gCount') && ($('#gCount').textContent = guideCount()); $('#guideBody').innerHTML = guideBodyHTML(); },
  cmdk(){ closePop(); openCmdk(); },
  jump(el){ $('#cs-' + el.dataset.n)?.scrollIntoView({behavior:'smooth', block:'start'}); },
  range(el){ state.range = el.dataset.v; $$('[data-action="range"]').forEach(b => b.classList.toggle('active', b === el)); },
  tab(el){ markDone('sort'); state.tab = el.dataset.v; state.sel.clear(); refreshOrders(); },
  sort(el){ markDone('sort'); const k = el.dataset.k; state.sort = {k, dir: state.sort.k === k ? -state.sort.dir : 1}; refreshOrders(); },
  bulkClear(){ state.sel.clear(); refreshOrders(); },
  bulkConfirm(){ markDone('bulk'); const n = state.sel.size; state.sel.clear(); refreshOrders(); notify({title:t('n.confirmed', {n}), msg:t('n.confirmedSub')}); },
  bulkPrint(){ notify({type:'info', title:t('n.printed', {n:state.sel.size}), msg:t('n.printedSub')}); },
  stock(el){ markDone('inline'); const P = PRODUCTS[el.dataset.id]; P.stock = Math.max(0, P.stock + +el.dataset.d); rerenderSection(7); },
  cluster(el){ state.cluster = el.dataset.v; $$('.cl').forEach(c => c.classList.toggle('active', c === el)); },
  tone(el){ markDone('tone'); state.tone = el.dataset.v; $$('[data-action="tone"]').forEach(b => b.classList.toggle('active', b === el)); typeDraft(t('cp.d.' + state.tone)); },
  regen(){ typeDraft(t('cp.d.' + state.tone)); },
  sendReply(el){ el.classList.add('is-loading'); setTimeout(() => { el.classList.remove('is-loading'); notify({title:t('n.sent'), msg:t('n.sentSub')}); }, 700); },
  fb(el){ el.style.color = 'var(--primary)'; el.style.background = 'var(--primary-tint)'; },
  demoNotify(el){
    const v = el.dataset.v;
    const m = {success:['n.saved',''], info:['n.info','n.infoSub'], warning:['n.warn','n.warnSub'], error:['n.err','n.errSub']}[v];
    notify({type:v, title:t(m[0]), msg:m[1] ? t(m[1]) : ''});
  },
  demoLoading(el){ el.classList.add('is-loading'); setTimeout(() => el.classList.remove('is-loading'), 1400); },
  demoDialog(){ markDone('overlay'); closePop(); openDialog(); },
  dlgOk(){ closeOverlay(); notify({type:'info', title:t('n.rejected')}); },
  demoDrawer(){ markDone('overlay'); openDrawerDemo(); },
  drawerSave(el){ el.classList.add('is-loading'); setTimeout(() => { closeOverlay(); notify({title:t('n.saved'), msg:'HANOI10'}); }, 700); },
  dismissNotify(el){ el.closest('.notify')?._kill(); },
};
let draftTimer;
function typeDraft(text){
  const ta = $('#draft'), box = $('#composer'); if (!ta) return;
  clearInterval(draftTimer); box.classList.add('typing'); ta.value = '';
  let i = 0;
  draftTimer = setInterval(() => { i += 3; ta.value = text.slice(0, i); if (i >= text.length){ clearInterval(draftTimer); box.classList.remove('typing'); } }, 12);
}
function rerenderSection(n){
  const s = $('#cs-' + n); if (!s) return;
  const card = s.querySelector('.card.flush'); if (card && n === 7) card.innerHTML = productsTableHTML();
}
const CHANGES = {
  vOn(el){ const v = VOUCHERS[+el.dataset.i]; v.on = el.checked; markDone('vPause'); $('#vTable').innerHTML = vTableHTML(); notify({type:'info', title:t(v.on ? 'n.vResumed' : 'n.vPaused', {c:v.code})}); },
  pSel(el){ el.checked ? state.pr.sel.add(el.dataset.id) : state.pr.sel.delete(el.dataset.id); refreshP(); },
  pSelAll(el){ pView().forEach(([id]) => el.checked ? state.pr.sel.add(id) : state.pr.sel.delete(id)); refreshP(); },
  pCat(el){ markDone('pTab'); state.pr.cat = el.value; refreshP(); },
  pPrice(el){ const P = PRODUCTS[el.dataset.id], v = parseNum(el.value); if (v > 0){ P.price = toUSD(v); afterProductChange(); markDone('pInline'); notify({title:t('n.saved'), msg:t('n.price', {v:money(P.price)})}); } else el.value = money(P.price); },
  pOn(el){ const P = PRODUCTS[el.dataset.id]; P.on = el.checked; afterProductChange(); markDone('pInline'); notify({type:P.on ? 'success' : 'info', title:t(P.on ? 'n.on' : 'n.off', {name:esc(t('p.' + el.dataset.id))})}); },
  oSel(el){ el.checked ? state.o.sel.add(el.dataset.id) : state.o.sel.delete(el.dataset.id); refreshO(); },
  oSelAll(el){ const all = oView().slice((state.o.page - 1) * O_PAGE, state.o.page * O_PAGE); all.forEach(o => el.checked ? state.o.sel.add(o.id) : state.o.sel.delete(o.id)); refreshO(); },
  oPay(el){ markDone('oTab'); state.o.pay = el.value; state.o.page = 1; refreshO(); },
  oCar(el){ state.o.car = el.value; state.o.page = 1; refreshO(); },
  sel(el){ el.checked ? state.sel.add(el.dataset.id) : state.sel.delete(el.dataset.id); refreshOrders(); },
  selAll(el){ ordersView().forEach(o => el.checked ? state.sel.add(o.id) : state.sel.delete(o.id)); refreshOrders(); },
  price(el){ const v = parseFloat(el.value.replace(/[^\d.,]/g, '').replace(/\./g, '').replace(',', '.')); if (!isNaN(v)){ const P = PRODUCTS[el.dataset.id]; P.price = state.lang === 'vi' ? v / RATE : v / (v > 1000 ? 100 : 1); notify({title:t('n.saved'), msg:t('n.price', {v:money(P.price)})}); rerenderSection(7); } },
  stockIn(el){ markDone('inline'); const P = PRODUCTS[el.dataset.id]; P.stock = Math.max(0, parseInt(el.value) || 0); notify({title:t('n.saved'), msg:t('n.stock', {name:t('p.' + el.dataset.id), n:P.stock})}); rerenderSection(7); },
  toggleOn(el){ markDone('inline'); const P = PRODUCTS[el.dataset.id]; P.on = el.checked; notify({type: P.on ? 'success' : 'info', title:t(P.on ? 'n.on' : 'n.off', {name:t('p.' + el.dataset.id)})}); rerenderSection(7); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action],[data-go]');
  if (popEl && !e.target.closest('.pop') && !(el && popEl._anchor === el)) closePop();
  if (!e.target.closest('#fEmail') && $('#sugHost')) $('#sugHost').innerHTML = '';
  if (e.target.id === 'email') showSuggest();
  if (!el) return;
  if (e.target.closest('input,label,textarea,select') && !e.target.closest('[data-action]')) return;
  if (el.dataset.go && el.dataset.go.startsWith('order/') && el.closest('#oTable')) markDone('oDetail');
  if (el.dataset.go && el.closest('#brief')) markDone('briefAct');
  if (el.dataset.go && el.closest('#todo')) markDone('todo');
  if (el.dataset.go && !el.dataset.action){ closePop(); if ($('#overlays').children.length) closeOverlay(); if (state.cop && matchMedia('(max-width:1279px)').matches) setCop(false); go(el.dataset.go); return; }
  const fn = ACTIONS[el.dataset.action];
  if (fn){ e.preventDefault(); const r = fn(el); if (r && r.catch) r.catch(err => console.warn(err)); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'paFile' || !state.pd) return;
  const f = e.target.files && e.target.files[0]; if (!f || !/^image\//.test(f.type)) return;
  const url = URL.createObjectURL(f);
  if (GEM.live()) return pdAiGem(url);
  const d = state.pd; d.aiBusy = true; pdRerender();
  const part = await GEM.img(url, 900).catch(() => null);
  setTimeout(() => { if (state.pd !== d) return; pdAiFill(); if (part) d.imgs[0] = d.variants[0].img = 'data:image/jpeg;base64,' + part.inlineData.data; markDone('pAiList'); pdRerender(); }, 1200);
});
document.addEventListener('change', e => {
  if (e.target.id !== 'srcFile') return;
  const f = e.target.files && e.target.files[0]; if (!f || !/^image\//.test(f.type)) return;
  srcScan(hsh(f.name) % SRC_Q.length, URL.createObjectURL(f));
});
document.addEventListener('change', e => {
  const vf = e.target.closest('input[type=radio][data-vf], input[type=date][data-vf]');
  if (vf && vForm){ vForm[vf.dataset.vf] = vf.value; if (vf.type === 'radio') $('#vfBody').innerHTML = vFormHTML(); return; }
  const pd = e.target.closest('select[data-pd], input[type=checkbox][data-pd]');
  if (pd && state.pd){ pdSet(pd.dataset.pd, pd.type === 'checkbox' ? pd.checked : pd.value); pdRepaint(); return; }
  const el = e.target.closest('[data-action-change]');
  if (el && CHANGES[el.dataset.actionChange]) CHANGES[el.dataset.actionChange](el);
});
document.addEventListener('submit', e => {
  if (e.target.closest('[data-form="repAsk"]')){ e.preventDefault(); const inp = $('#repIn'), q = inp.value.trim(); if (!q) return; inp.value = ''; markDone('repAsk'); setCop(true); return ask(matchQ(q.toLowerCase()), q); }
  if (e.target.closest('[data-form="msg"]')){ e.preventDefault(); const inp = $('#mIn'); const v = inp.value; inp.value = ''; return mSend(v); }
  if (e.target.closest('[data-form="login"]')){ e.preventDefault(); return doLogin(); }
  const f = e.target.closest('[data-form="ask"]'); if (!f) return;
  e.preventDefault();
  const inp = $('#askIn'), q = inp.value.trim(); if (!q) return;
  const low = q.toLowerCase();
  markDone('copFree'); inp.value = ''; const m = matchQ(low);
  if (m === 'x' && GEM.live()) askGem(q); else ask(m, q);
});
document.addEventListener('keydown', e => {
  if (AUTO.on && e.isTrusted){ if (e.key === 'Escape') ACTIONS.autoExit(); if (e.key === ' ') { e.preventDefault(); ACTIONS.autoPause(); } return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && state.authed){ e.preventDefault(); if ($('.cmdk')) closeOverlay(); else openCmdk(); }
  if (e.key === 'Escape'){
    if (popEl) return closePop();
    if ($('#overlays').children.length) return closeOverlay();
    if (state.drawer) return ACTIONS.closeDrawer();
    if (state.cop) return setCop(false);
    if ($('#sugHost')?.firstChild) $('#sugHost').innerHTML = '';
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pSearch'){ state.pr.q = e.target.value; refreshP(); }
  const vf = e.target.closest('[data-vf]');
  if (vf && vForm){ const k = vf.dataset.vf, v = vf.value;
    vForm[k] = ['val','min'].includes(k) ? (k === 'val' && vForm.type === 'pct' ? parseFloat(v) || 0 : toUSD(parseNum(v) || 0)) : k === 'limit' ? parseInt(v) || 0 : v;
    const fld = vf.closest('.field'); if (fld?.classList.contains('has-error')){ fld.classList.remove('has-error'); fld.querySelector('.err-msg')?.remove(); delete vForm.errs[k === 'from' ? 'to' : k]; } }
  if (e.target.id === 'mSearch'){ state.msg.q = e.target.value; const pos = e.target.selectionStart; mRefresh(); const n = $('#mSearch'); n.focus(); n.setSelectionRange(pos, pos); }
  const pd = e.target.closest('[data-pd]');
  if (pd && state.pd){
    pdSet(pd.dataset.pd, pd.type === 'checkbox' ? pd.checked : pd.value);
    const c = $(`[data-cnt="${pd.dataset.pd}"]`); if (c) c.textContent = t('pd.chars', {n:pd.value.length});
    if (pd.dataset.pd.startsWith('desc')) markDone('pEditTyped');
    if (state.pd.errs.name && state.pd.name.vi.trim()){ delete state.pd.errs.name; $('#fName')?.classList.remove('has-error'); $('#fName .err-msg')?.remove(); }
    if (state.pd.errs.price && state.pd.price > 0){ delete state.pd.errs.price; $('#fPrice')?.classList.remove('has-error'); $('#fPrice .err-msg')?.remove(); }
    pdRepaint();
  }
  if (e.target.id === 'oSearch'){ state.o.q = e.target.value; state.o.page = 1; refreshO(); if (e.target.value.trim().length >= 3) markDone('oSearch'); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'email') showSuggest(); });
let lastW = innerWidth;
window.addEventListener('resize', () => { if (innerWidth !== lastW){ lastW = innerWidth; closePop(); } if (innerWidth < 1200) markDone('resize'); });

/* boot */
(function(){
  const h = (location.hash || '').slice(1);
  if (h && (h === 'components' || h.startsWith('order/') || PAGES.some(p => p.id === h))){ if (state.authed) state.route = h; else state.after = h; }
  renderShell();
  GEM.probe().then(() => { if ((GEM.proxy || GEM.orProxy) && state.authed) renderShell(); });
  if (!store.get('tts_guide_seen', false)){ store.set('tts_guide_seen', true); setTimeout(openGuide, 400); }
})();
</script>
